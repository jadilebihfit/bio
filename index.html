<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0e0c" />
  <title>JadiLebihFit</title>
  <style>
    :root {
      --bg:            #0f0e0c;
      --surface:       hsl(36 8% 9%);
      --surface2:      hsl(38 10% 12%);
      --border:        hsl(40 8% 18%);
      --border-hover:  hsl(44 72% 52% / .45);
      --text:          hsl(40 15% 96%);
      --muted:         hsl(40 8% 62%);
      --gold:          44 72% 52%;
      --gold-light:    44 82% 68%;
      --gold-dark:     40 55% 34%;
      --radius:        0.65rem;
      --font:          -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 72px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      left: 50%; top: 0;
      width: 820px; height: 520px;
      margin-left: -410px;
      background: radial-gradient(ellipse 55% 55% at 50% 38%,
        hsl(46 94% 56% / .13),
        hsl(44 88% 52% / .05) 48%,
        transparent 74%);
      filter: blur(28px);
      pointer-events: none;
      z-index: 0;
      animation: glowDrift 14s ease-in-out infinite alternate;
    }
    @keyframes glowDrift {
      0%   { transform: translate(-22px, 4px) scale(1);    opacity: .8; }
      100% { transform: translate(24px, -10px) scale(1.1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }

    .gold-grad {
      background: linear-gradient(100deg,
        hsl(40 68% 46%) 0%,
        hsl(46 92% 70%) 22%,
        hsl(48 100% 85%) 38%,
        hsl(45 90% 62%) 55%,
        hsl(40 72% 48%) 78%,
        hsl(46 92% 70%) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 60px 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      margin-bottom: 36px;
    }

    .avatar-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg,
        hsl(40 68% 46%),
        hsl(48 100% 78%),
        hsl(42 72% 46%));
      box-shadow: 0 0 32px -8px hsl(var(--gold) / .5);
      flex-shrink: 0;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .profile h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-transform: uppercase;
    }

    .profile .tagline {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      letter-spacing: 0.2px;
    }

    .profile .bio {
      font-size: 13.5px;
      line-height: 1.65;
      color: hsl(40 12% 75%);
      max-width: 320px;
    }

    .tabs-wrapper {
      width: 100%;
      margin-bottom: 16px;
    }

    .tabs-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: hsl(var(--gold) / .5);
      margin-bottom: 8px;
      animation: hintPulse 2.5s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: .5; }
      50%       { opacity: 1; }
    }

    .tabs {
      width: 100%;
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 6px;
      border: none;
      border-radius: 999px;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      letter-spacing: -0.1px;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      outline: 1.5px solid transparent;
      outline-offset: -1px;
      white-space: nowrap;
    }

    .tab-btn:not(.active)::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 20%,
        hsl(var(--gold) / .18) 50%,
        transparent 80%
      );
      transform: translateX(-100%);
      animation: tabShimmer 3s ease-in-out infinite;
    }

    .tab-btn:not(.active):nth-child(2)::before { animation-delay: 0.4s; }
    .tab-btn:not(.active):nth-child(3)::before { animation-delay: 0.8s; }
    .tab-btn:not(.active):nth-child(4)::before { animation-delay: 1.2s; }
    .tab-btn:not(.active):nth-child(5)::before { animation-delay: 1.6s; }

    @keyframes tabShimmer {
      0%   { transform: translateX(-100%); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translateX(100%); opacity: 1; }
      60%  { opacity: 0; }
      100% { transform: translateX(100%); opacity: 0; }
    }

    .tab-btn:not(.active) {
      animation: tabGlow 3s ease-in-out infinite;
    }
    .tab-btn:not(.active):nth-child(2) { animation-delay: 0.4s; }
    .tab-btn:not(.active):nth-child(3) { animation-delay: 0.8s; }
    .tab-btn:not(.active):nth-child(4) { animation-delay: 1.2s; }
    .tab-btn:not(.active):nth-child(5) { animation-delay: 1.6s; }

    @keyframes tabGlow {
      0%, 100% { outline-color: transparent;            color: var(--muted); }
      40%, 60% { outline-color: hsl(var(--gold)/.35);  color: hsl(var(--gold-light)); }
    }

    .tab-btn:hover:not(.active) {
      background: hsl(var(--gold) / .08);
      color: hsl(var(--gold-light));
      animation: none;
      outline-color: hsl(var(--gold) / .4);
    }

    .tab-btn.active {
      background: linear-gradient(180deg, hsl(46 82% 62%), hsl(42 72% 46%));
      color: hsl(40 40% 8%);
      font-weight: 700;
      box-shadow: 0 4px 16px -6px hsl(var(--gold) / .55),
                  inset 0 1px 0 hsl(48 90% 82% / .55);
      animation: none;
    }
    .tab-btn.active::before { display: none; }

    #panels-container { width: 100%; }

    .panel { display: none; width: 100%; flex-direction: column; gap: 10px; }
    .panel.active { display: flex; animation: fadeUp 0.22s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: hsl(var(--gold));
      margin-top: 4px;
      margin-bottom: 2px;
      padding-left: 2px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      transition: background 0.2s, transform 0.16s, border-color 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .link-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, hsl(var(--gold) / .3), transparent);
      transition: opacity 0.2s;
      opacity: 0;
    }

    .link-card:hover {
      background: var(--surface2);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -16px rgba(0,0,0,.8),
                  0 4px 14px -8px hsl(var(--gold) / .3);
    }

    .link-card:hover::before { opacity: 1; }
    .link-card:active { transform: scale(0.985); }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: hsl(var(--gold) / .1);
      border: 1px solid hsl(var(--gold) / .2);
    }

    .card-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.7;
    }

    .card-icon.blue-icon {
      background: hsl(214 72% 52% / .1);
      border-color: hsl(214 72% 52% / .2);
    }

    .card-text { flex: 1; min-width: 0; }

    .card-title {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .badge-gold {
      background: hsl(var(--gold) / .15);
      color: hsl(var(--gold-light));
    }

    .badge-blue {
      background: hsl(214 72% 52% / .14);
      color: hsl(214 82% 70%);
    }

    .card-arrow {
      color: hsl(var(--gold) / .4);
      flex-shrink: 0;
      transition: transform 0.2s, color 0.2s;
    }

    .link-card:hover .card-arrow {
      transform: translate(2px, -2px);
      color: hsl(var(--gold-light));
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-decoration: none;
      transition: background 0.18s, color 0.18s, transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .social-btn:hover {
      background: var(--surface2);
      color: hsl(var(--gold-light));
      transform: translateY(-2px);
      border-color: hsl(var(--gold) / .4);
      box-shadow: 0 8px 20px -10px hsl(var(--gold) / .4);
    }

    .social-btn svg { width: 17px; height: 17px; fill: currentColor; }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 28px 0 0;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: hsl(40 8% 42%);
      letter-spacing: 0.3px;
      text-align: center;
    }

    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
    .ripple-fx {
      position: absolute;
      border-radius: 50%;
      background: hsl(var(--gold) / .1);
      width: 60px; height: 60px;
      margin-top: -30px; margin-left: -30px;
      animation: ripple 0.5s linear;
      pointer-events: none;
    }

    @media (min-width: 520px) {
      .wrapper    { padding-top: 76px; }
      .profile h1 { font-size: 26px; }
      .card-title { font-size: 15.5px; }
    }
  </style>
</head>

  const AppData = JSON.parse(localStorage.getItem('jadilebihfit_data')) || DEFAULT_DATA;

  function renderApp() {
    document.getElementById('ui-name').textContent = AppData.profile.name;
    document.getElementById('ui-tagline').textContent = AppData.profile.tagline;
    document.getElementById('ui-bio').textContent = AppData.profile.bio;

    const tabsContainer = document.getElementById('ui-tabs');
    const panelsContainer = document.getElementById('panels-container');
    const socialsContainer = document.getElementById('ui-socials');

    const currentActiveSection = AppData.sections[0]?.id;

    tabsContainer.innerHTML = AppData.sections.map((sec, i) => {
      const isActive = i === 0;
      return '<button class="tab-btn ' + (isActive ? 'active' : '') + '" role="tab" aria-selected="' + isActive + '" data-panel="' + sec.id + '">' + sec.title + '</button>';
    }).join('');

    panelsContainer.innerHTML = AppData.sections.map((sec, i) => {
      const isActive = i === 0;
      const cardsHtml = (sec.items || []).map(item => {
        const iconSvg = ICONS[item.icon] || ICONS.link;
        const isBlue = item.style === 'blue';
        const colorStroke = isBlue ? 'hsl(214,82%,70%)' : 'hsl(46,82%,62%)';
        const iconClass = isBlue ? 'card-icon blue-icon' : 'card-icon';
        const badgeClass = isBlue ? 'badge badge-blue' : 'badge badge-gold';

        return '<a class="link-card" href="' + item.url + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="card-left">' +
            '<div class="' + iconClass + '">' +
              iconSvg.replace('stroke="currentColor"', 'stroke="' + colorStroke + '"') +
            '</div>' +
            '<div class="card-text">' +
              '<div class="card-title">' + item.title + '</div>' +
              '<div class="card-sub"><span class="' + badgeClass + '">' + item.badge + '</span> ' + item.subtitle + '</div>' +
            '</div>' +
          '</div>' +
          '<svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>' +
          '</svg>' +
        '</a>';
      }).join('');

      return '<div class="panel ' + (isActive ? 'active' : '') + '" id="panel-' + sec.id + '" role="tabpanel">' +
        '<p class="section-label">' + (sec.label || sec.title) + '</p>' +
        (cardsHtml || '<p style="font-size:12px; color:var(--muted); text-align:center; padding:20px;">Belum ada item di section ini.</p>') +
      '</div>';
    }).join('');

    // Render Socials
    if (AppData.socials) {
      socialsContainer.innerHTML = Object.entries(AppData.socials).map(([key, url]) => {
        if (!url) return '';
        const svg = SOCIAL_SVGS[key] || '';
        return '<a class="social-btn" href="' + url + '" target="_blank" rel="noopener noreferrer" aria-label="' + key + '">' + svg + '</a>';
      }).join('');
    }

    // Tab interaction
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        btn.setAttribute('aria-selected','true');
        document.getElementById('panel-' + btn.dataset.panel)?.classList.add('active');
      });
    });

    // Ripple effect
    document.querySelectorAll('.link-card').forEach(card => {
      card.addEventListener('click', function(e) {
        const r = document.createElement('span');
        r.classList.add('ripple-fx');
        const rect = this.getBoundingClientRect();
        r.style.left = (e.clientX - rect.left) + 'px';
        r.style.top  = (e.clientY - rect.top)  + 'px';
        this.appendChild(r);
        setTimeout(() => r.remove(), 500);
      });
    });
  }

  renderApp();
</script>
