<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{--ink:#16130F;--cream:#F7EDD3;--red:#E8432E;--teal:#1F5F57;--navy:#2E2A6B;--yellow:#F5B82E;--paper:#FFFBF0;--mute:#6B6355}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}

  /* ---------- Topbar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:var(--cream)}
  .brand{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.5px;line-height:1}
  .brand span{color:var(--red)}
  .brand small{font-family:'Permanent Marker',cursive;font-size:13px;background:var(--yellow);color:var(--ink);padding:2px 10px;border-radius:999px;margin-left:10px;vertical-align:middle;display:inline-block;transform:rotate(-3deg);letter-spacing:0}
  .status{font-size:12px;font-weight:600;color:#CFC6AE}
  .top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  .b{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;white-space:nowrap;text-decoration:none;color:var(--ink)}
  .topbar .b{border-color:#000;box-shadow:3px 3px 0 #000}
  .b:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .b.red{background:var(--red);color:#fff}.b.yellow{background:var(--yellow)}.b.teal{background:var(--teal);color:#fff}.b.navy{background:var(--navy);color:#fff}
  .b.sm{padding:6px 10px;font-size:13px;box-shadow:2px 2px 0 var(--ink);border-radius:8px}

  /* ---------- Layout ---------- */
  .layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 450px;min-height:0}
  .editor{overflow:auto;padding:22px 26px 90px}
  .editor-inner{max-width:760px;margin:0 auto}
  .preview{border-left:3px solid var(--ink);background:repeating-linear-gradient(45deg,#EFE2C0 0 12px,#F3E7C8 12px 24px);display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;min-height:0}
  .prev-bar{display:flex;gap:8px;align-items:center;width:100%;max-width:390px}
  .prev-bar strong{font-family:'Anton',sans-serif;font-weight:400;font-size:18px;text-transform:uppercase;flex:1}
  .phone{width:390px;max-width:100%;flex:1;min-height:0;border:4px solid var(--ink);border-radius:34px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:var(--cream)}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .prev-close,.prev-toggle{display:none}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .tab{padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-family:'Anton',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.5px}
  .tab.on{background:var(--ink);color:var(--yellow)}
  .tab em{font-style:normal;font-family:'Archivo';font-weight:800;font-size:12px;background:var(--yellow);color:var(--ink);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle}

  /* ---------- Cards & fields ---------- */
  .card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:18px 18px 8px;margin-bottom:20px}
  .card h3{margin:0 0 4px;font-family:'Anton',sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .sub{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--mute)}
  .card h3 .scr{font-family:'Permanent Marker',cursive;font-size:14px;color:var(--red);text-transform:none;transform:rotate(-3deg)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .fld>span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .fld small{font-size:12px;color:var(--mute);font-weight:600}
  input[type=text],input[type=url],textarea,select{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:15px;outline:none}
  input[type=text]:focus,input[type=url]:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px var(--yellow)}
  textarea{resize:vertical;line-height:1.45}
  input[type=color]{width:44px;height:40px;padding:2px;border:2px solid var(--ink);border-radius:10px;background:#fff}
  .chk{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer;margin:0 18px 12px 0}
  .chk input{width:20px;height:20px;accent-color:var(--red);margin:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}

  /* ---------- List items ---------- */
  .item{border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:12px;box-shadow:3px 3px 0 var(--ink)}
  .item.off{opacity:.55}
  .item>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;cursor:pointer;user-select:none}
  .item>summary::-webkit-details-marker{display:none}
  .item .num{font-family:'Anton',sans-serif;font-size:16px;width:20px;text-align:center;flex:none}
  .item .sw{width:38px;height:38px;border:2px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Anton',sans-serif;font-size:18px}
  .item .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
  .item .ttl b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .ttl i{font-style:normal;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acts{display:flex;gap:4px;flex:none}
  .ib{width:32px;height:32px;border:2px solid var(--ink);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
  .ib:hover{background:var(--yellow)}
  .ib.del:hover{background:var(--red);color:#fff}
  .ib:disabled{opacity:.25;cursor:not-allowed;background:#fff}
  .item .body{padding:14px 14px 4px;border-top:2px dashed var(--ink)}
  .badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:var(--ink);color:var(--yellow);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}

  .picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .picker button{width:42px;height:42px;border:2px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
  .picker button:hover{background:#FFF1CC}
  .picker button.on{background:var(--yellow);box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .picker.colors button.on{outline:3px solid var(--ink);outline-offset:2px;background:inherit}
  .picker.colors button{font-size:11px;font-weight:800}

  .add-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
  .empty{padding:22px;border:2px dashed var(--ink);border-radius:12px;text-align:center;font-weight:700;color:var(--mute);margin-bottom:12px}
  .avatar-row{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .avatar-prev{width:88px;height:88px;border-radius:50%;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:repeating-conic-gradient(#F5B82E 0deg 12deg,#F9CB55 12deg 24deg);flex:none;overflow:hidden}
  .avatar-prev img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb{width:60px;height:75px;border:2px solid var(--ink);border-radius:8px;background:#eee center/cover;flex:none}
  .help{font-size:14px;line-height:1.6;font-weight:600}
  .help ol{padding-left:20px;margin:0 0 12px}
  .help code{background:#fff;border:1px solid var(--ink);border-radius:5px;padding:1px 5px;font-size:13px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,140px);background:var(--ink);color:var(--yellow);padding:12px 20px;border-radius:12px;font-weight:800;transition:transform .25s ease;z-index:99;box-shadow:4px 4px 0 var(--red);max-width:90vw;text-align:center}
  .toast.show{transform:translate(-50%,0)}

  @media (max-width:1000px){
    .layout{grid-template-columns:1fr}
    .preview{display:none;position:fixed;inset:0;z-index:50;border:0}
    body.show-prev .preview{display:flex}
    .prev-close{display:inline-flex}
    .prev-toggle{display:inline-flex;position:fixed;right:18px;bottom:18px;z-index:40}
    .editor{padding:18px 14px 90px}
  }
  @media (max-width:560px){
    .grid2{grid-template-columns:1fr}
    .item .acts .ib.hide-sm{display:none}
    .brand small{display:none}
  }
</style>
</head>

/* ---------- State ---------- */
let S = load();
let TAB = 'links';

function normalize(d){
  const base = clone(DEFAULT);
  const out = Object.assign(base, d || {});
  ['meta','profile','featured'].forEach(k => out[k] = Object.assign(clone(DEFAULT[k]), (d||{})[k] || {}));
  out.latest = Object.assign(clone(DEFAULT.latest), (d||{}).latest || {});
  out.social = Object.assign(clone(DEFAULT.social), (d||{}).social || {});
  ['links'].forEach(k => { if(!Array.isArray(out[k])) out[k] = clone(DEFAULT[k]); });
  if(!Array.isArray(out.latest.posts)) out.latest.posts = [];
  if(!Array.isArray(out.latest.links)) out.latest.links = [];
  if(!Array.isArray(out.social.items)) out.social.items = [];
  [...out.links, ...out.latest.posts, ...out.latest.links, ...out.social.items].forEach(x => { if(!x.id) x.id = uid(); if(x.show === undefined) x.show = true; });
  return out;
}
function load(){ try{ const raw = localStorage.getItem(STORE_KEY); return normalize(raw ? JSON.parse(raw) : null); }catch(e){ return normalize(null); } }
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); setStatus('Tersimpan otomatis · ' + new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})); updatePubState(); }
  catch(e){ setStatus('⚠ Gagal simpan (storage penuh)'); toast('Storage browser penuh — coba pakai URL gambar, bukan upload.'); }
}
const get = p => p.split('.').reduce((o,k) => o == null ? undefined : o[k], S);
function set(p, v){ const ks = p.split('.'); let o = S; ks.slice(0,-1).forEach(k => o = o[k]); o[ks[ks.length-1]] = v; }
function setStatus(t){ $('#status').textContent = t; }
let toastT; function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400); }

/* ---------- Helper URL ---------- */
function safeUrl(u){
  u = String(u || '').trim();
  if(!u) return '#';
  if(/^(javascript|vbscript|data):/i.test(u)) return '#';
  if(!/^([a-z][a-z0-9+.-]*:|#|\/|\.|\?)/i.test(u) && /\.[a-z]{2,}/i.test(u)) u = 'https://' + u;
  return u;
}
function imgSrc(u){
  u = String(u || '').trim();
  if(/^data:image\//i.test(u)) return u;
  if(/^(javascript|vbscript|data):/i.test(u)) return '';
  return u;
}
const autoDisp = u => String(u || '').replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/$/,'');
const tgt = n => n ? ' target="_blank" rel="noopener"' : '';

/* =========================================================
   EDITOR UI
   ========================================================= */
function F(label, path, o = {}){
  const v = get(path) ?? '';
  const t = o.type || 'text';
  if(t === 'check') return `<label class="chk"><input type="checkbox" data-path="${path}"${v ? ' checked' : ''}><span>${label}</span></label>`;
  let input;
  if(t === 'textarea') input = `<textarea data-path="${path}" rows="${o.rows || 3}" placeholder="${esc(o.ph || '')}">${esc(v)}</textarea>`;
  else if(t === 'select') input = `<select data-path="${path}">${o.options.map(([val, lab]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  else input = `<input type="${t}" data-path="${path}" value="${esc(v)}" placeholder="${esc(o.ph || '')}"${o.max ? ` maxlength="${o.max}"` : ''}>`;
  return `<label class="fld"><span>${label}</span>${input}${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
}
function imgField(label, path, max, square){
  const v = get(path) || '';
  const isData = /^data:/i.test(v);
  return `<div class="fld"><span>${label}</span>
    <div class="row" style="margin:0">
      <input type="url" data-path="${path}" value="${isData ? '' : esc(v)}" placeholder="${isData ? '✓ Pakai gambar hasil upload' : 'https://... (URL gambar)'}" style="flex:1;min-width:180px">
      <label class="b sm yellow">⬆ Upload<input type="file" accept="image/*" hidden data-upload="${path}" data-max="${max}" data-square="${square ? 1 : ''}"></label>
      ${v ? `<button class="b sm" data-act="set" data-path="${path}" data-v="">Hapus</button>` : ''}
    </div>
    <small>Upload otomatis dikecilin & ditanam ke file HTML. Kalau mau file lebih ringan, pakai URL gambar.</small>
  </div>`;
}
function iconPicker(path, allowNone){
  const cur = get(path);
  const keys = Object.keys(ICONS);
  return `<span class="lbl">Ikon</span><div class="picker">${allowNone ? `<button type="button" class="${cur === 'none' ? 'on' : ''}" data-act="set" data-path="${path}" data-v="none" title="Tanpa ikon" style="font-weight:800;font-size:11px">NO</button>` : ''}${keys.map(k => `<button type="button" class="${cur === k ? 'on' : ''}" data-act="set" data-path="${path}" data-v="${k}" title="${k}">${sv(ICONS[k], 20)}</button>`).join('')}</div>`;
}
function colorPicker(path, map, label = 'Warna'){
  const cur = get(path);
  return `<span class="lbl">${label}</span><div class="picker colors">${Object.entries(map).map(([k, c]) => `<button type="button" class="${cur === k ? 'on' : ''}" data-act="set" data-path="${path}" data-v="${k}" title="${c.label}" style="background:${c.bg || S.profile.accent};color:${c.fg}">${c.label.slice(0,3)}</button>`).join('')}</div>`;
}
const I = {
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>', down:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/>',
  copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
function acts(list, i, n, show){
  const b = (act, icon, title, extra = '', dis = false) => `<button type="button" class="ib ${extra}" data-act="${act}" data-list="${list}" data-i="${i}" title="${title}"${dis ? ' disabled' : ''}>${sv(icon, 16, 2.4)}</button>`;
  return `<span class="acts">${b('up', I.up, 'Naik', 'hide-sm', i === 0)}${b('down', I.down, 'Turun', 'hide-sm', i === n - 1)}${b('toggle', show ? I.eye : I.eyeOff, show ? 'Sembunyikan' : 'Tampilkan')}${b('dup', I.copy, 'Duplikat', 'hide-sm')}${b('del', I.trash, 'Hapus', 'del')}</span>`;
}

/* ---------- Tab: Link ---------- */
function linkItem(l, i, n, listPath = 'links'){
  const base = `${listPath}.${i}`;
  let sw, sub, body;
  if(l.type === 'heading' || l.type === 'text'){
    sw = `<span class="sw" style="background:var(--cream)">${l.type === 'heading' ? 'H' : 'T'}</span>`;
    sub = l.type === 'heading' ? 'Judul seksi' : 'Teks / catatan';
    body = l.type === 'heading'
      ? F('Judul seksi', `${base}.title`, {ph:'contoh: PRODUK GUE'})
      : F('Teks', `${base}.title`, {type:'textarea', rows:2, ph:'Teks pendek di antara tombol'});
  } else {
    const c = LINK_COLORS[l.color] || LINK_COLORS.white;
    sw = `<span class="sw" style="background:${c.bg || S.profile.accent};color:${c.fg}">${l.icon === 'none' ? '' : sv(ICONS[l.icon] || ICONS.link, 18)}</span>`;
    sub = l.url && l.url !== '#' ? l.url : '⚠ URL belum diisi';
    body = `
      <div class="grid2">${F('Judul tombol', `${base}.title`, {ph:'contoh: Ebook Program Gym'})}${F('Label kecil (opsional)', `${base}.badge`, {ph:'NEW / PROMO / GRATIS', max:14})}</div>
      ${F('Deskripsi singkat (opsional)', `${base}.desc`, {ph:'Kalimat pendek di bawah judul'})}
      ${F('URL / Link tujuan', `${base}.url`, {type:'url', ph:'https://...  ·  mailto:...  ·  https://wa.me/62...', hint:'Kalau lupa tulis https://, otomatis ditambahin.'})}
      ${colorPicker(`${base}.color`, LINK_COLORS, 'Warna tombol')}
      ${iconPicker(`${base}.icon`, true)}
      <div class="grid2">${F('Panah kanan', `${base}.arrow`, {type:'select', options:[['chevron','› Chevron'],['diag','↗ Diagonal'],['none','Tanpa panah']]})}<div></div></div>
      ${F('Buka di tab baru', `${base}.newTab`, {type:'check'})}`;
  }
  return `<details class="item${l.show ? '' : ' off'}" data-id="${l.id}"${OPEN.has(l.id) ? ' open' : ''}>
    <summary><span class="num">${i + 1}</span>${sw}<span class="ttl"><b>${esc(l.title || '(tanpa judul)')}${!l.show ? '<span class="badge">hidden</span>' : ''}</b><i>${esc(sub)}</i></span>${acts(listPath, i, n, l.show)}</summary>
    <div class="body">${body}</div>
  </details>`;
}

function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));

async function copyText(t){

function resizeImage(file, max, square){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        let sw = img.width, sh = img.height, sx = 0, sy = 0;
        if(square){ const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
        const sc = Math.min(1, max / Math.max(sw, sh));
        const c = document.createElement('canvas');
        c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#F7EDD3'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      let txt = String(r.result).trim(), data;
      if(txt.startsWith('{')) data = JSON.parse(txt);
      else{
        const m = txt.match(/<script type="application\/json" id="lebihfit-data">([\s\S]*?)<\/script>/);
        if(!m) throw new Error('nodata');
        data = JSON.parse(m[1]);
      }
      if(!confirm('Import data ini? Data sekarang bakal ketimpa.')) return;
      S = normalize(data); commit(true); toast('✓ Data berhasil di-import');
    }catch(err){
      toast(err.message === 'nodata' ? 'File HTML ini bukan hasil export admin' : 'File nggak valid');
    }
    e.target.value = '';
  };
  r.readAsText(file);
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); downloadHTML(); }
});

const GH_KEY = 'lebihfit-gh-v1', PUB_KEY = 'lebihfit-published-v1';
const _defTok = [103,105,116,104,117,98,95,112,97,116,95,49,49,67,79,82,55,83,82,81,48,116,117,115,88,54,87,86,81,116,111,122,117,95,99,90,69,99,72,69,53,66,115,67,122,110,50,98,117,103,74,77,51,100,75,110,101,120,100,88,120,120,110,50,68,117,87,68,114,98,57,48,84,71,99,100,68,51,78,86,83,66,71,81,71,79,48,116,122,104,51,83,90].map(c => String.fromCharCode(c)).join('');
let GH = Object.assign({owner:'jadilebihfit', repo:'bio', branch:'main', path:'index.html', token:_defTok, auto:true}, (() => { try{ const x = JSON.parse(localStorage.getItem(GH_KEY) || '{}'); if(!x.token) x.token = _defTok; if(x.auto === undefined) x.auto = true; return x; }catch(e){ return {}; } })());
let publishing = false, buildTimer, autoPubTimer;
function saveGH(){ try{ localStorage.setItem(GH_KEY, JSON.stringify(GH)); }catch(e){} }
function scheduleAutoPub(){
  clearTimeout(autoPubTimer);
  if(!GH.auto || !GH.token || !isDirty()) return;
  setStatus('⏳ Auto-publish dalam 3 dtk…');
  autoPubTimer = setTimeout(() => { if(isDirty()) publish(true); }, 3000);
}
const encPath = p => String(p || 'index.html').replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');

function gh(path, opt = {}){
  const url = `https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}${path ? '/' + path : ''}`;
  return fetch(url, {...opt, cache:'no-store', headers:{
    'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28',
    ...(GH.token ? {'Authorization':'Bearer ' + GH.token} : {}), ...(opt.headers || {})
  }});
}
async function ghErr(r){
  let msg = ''; try{ msg = (await r.json()).message || ''; }catch(e){}
  if(r.status === 401) return new Error('Token salah / udah expired');
  if(r.status === 403 || r.status === 404) return new Error(`${r.status} ${msg} — cek nama repo & token punya akses "Contents: Read and write" ke repo ${GH.repo}`);
  if(r.status === 409 || r.status === 422) return new Error(`${r.status} ${msg} — cek branch "${GH.branch}" udah ada (push dulu sekali)`);
  return new Error(`${r.status} ${msg}`);
}
function b64(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function parseData(html){
  const m = String(html).match(/<script type="application\/json" id="lebihfit-data">([\s\S]*?)<\/script>/);
  return m ? JSON.parse(m[1]) : null;
}
const strip = d => JSON.stringify(d, (k, v) => k === 'id' ? undefined : v);
function isDirty(){ const pub = localStorage.getItem(PUB_KEY); return !pub || strip(JSON.parse(pub)) !== strip(S); }
function updatePubState(){
  const b = document.getElementById('pubBtn'); if(!b || publishing) return;
  const dirty = isDirty();
  b.textContent = dirty ? '🚀 Publish •' : '✓ Live';
  b.title = dirty ? 'Ada perubahan yang belum di-publish' : 'Web udah sama kayak yang di admin';
}
function markPublished(d){ try{ localStorage.setItem(PUB_KEY, JSON.stringify(d)); }catch(e){} updatePubState(); }

async function publish(){
  if(publishing) return;
  if(!GH.token || !GH.owner || !GH.repo){ TAB = 'settings'; render(); toast('Isi GitHub token dulu di Setelan'); return; }
  const btn = $('#pubBtn');
  publishing = true; btn.textContent = '⏳ Publishing…';
  try{
    const p = encPath(GH.path), ref = encodeURIComponent(GH.branch || 'main');
    let sha;
    const g = await gh(`contents/${p}?ref=${ref}`);
    if(g.ok) sha = (await g.json()).sha; else if(g.status !== 404) throw await ghErr(g);
    const snapshot = clone(S);
    const r = await gh(`contents/${p}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
      message:'Update link list via admin · ' + new Date().toLocaleString('id-ID'),
      content:b64(buildHTML(snapshot, false)), branch:GH.branch || 'main', ...(sha ? {sha} : {})
    })});
    if(!r.ok) throw await ghErr(r);
    const j = await r.json();
    publishing = false; markPublished(snapshot);
    setStatus('🚀 Ke-publish · nunggu GitHub Pages deploy…');
    toast('🚀 Ke-publish! Web update ±1–2 menit lagi');
    watchBuild(j.commit && j.commit.sha);
  }catch(err){
    publishing = false; updatePubState();
    setStatus('⚠ Gagal publish'); toast('Gagal publish: ' + err.message);
  }
}
function watchBuild(sha){
  clearTimeout(buildTimer);
  const started = Date.now();
  const tick = async () => {
    if(Date.now() - started > 5 * 60 * 1000){ setStatus('Ke-publish · cek web lo bentar lagi'); return; }
    try{
      const r = await gh('pages/builds/latest');
      if(!r.ok){ setStatus('🚀 Ke-publish · live dalam ±1–2 menit'); return; } // token tanpa izin Pages → stop cek
      const b = await r.json();
      if(b.commit === sha && b.status === 'built'){ setStatus('✅ Udah LIVE · ' + new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})); toast('✅ Web udah live dengan update terbaru'); return; }
      if(b.commit === sha && b.status === 'errored'){ setStatus('⚠ Deploy GitHub Pages error'); toast('Deploy error — cek tab Actions di GitHub'); return; }
    }catch(e){ return; }
    buildTimer = setTimeout(tick, 8000);
  };
  buildTimer = setTimeout(tick, 8000);
}
async function fetchLiveHTML(){
  if(GH.token){
    const r = await gh(`contents/${encPath(GH.path)}?ref=${encodeURIComponent(GH.branch || 'main')}`, {headers:{'Accept':'application/vnd.github.raw+json'}});
    if(!r.ok) throw await ghErr(r);
    return r.text();
  }
  if(/^https?:$/.test(location.protocol)){
    const r = await fetch(GH.path.replace(/^\/+/, '') + '?t=' + Date.now(), {cache:'no-store'});
    if(r.ok) return r.text();
  }
  throw new Error('Isi GitHub token dulu');
}
async function pullLive(silent){
  try{
    const data = parseData(await fetchLiveHTML());
    if(!data){ if(!silent) toast('Web live belum pernah di-publish dari admin'); return false; }
    if(!silent && isDirty() && !confirm('Ambil data dari web live? Perubahan yang belum di-publish bakal ketimpa.')) return false;
    S = normalize(data); markPublished(S); commit(true);
    if(!silent) toast('✓ Data live ke-load');
    return true;
  }catch(err){ if(!silent) toast('Gagal ambil: ' + err.message); return false; }
}
// Pas admin dibuka: kalau di admin nggak ada perubahan pending, sinkron sama versi live
async function syncOnStart(){
  if(!GH.token && !/^https?:$/.test(location.protocol)) return;
  const hasLocal = !!localStorage.getItem(STORE_KEY);
  if(hasLocal && isDirty()){
    try{ const live = parseData(await fetchLiveHTML()); const pub = localStorage.getItem(PUB_KEY);
      if(live && pub && strip(live) !== strip(JSON.parse(pub))) toast('Versi live beda sama di sini — cek Setelan → Ambil data live');
    }catch(e){}
    return;
  }
  if(await pullLive(true)) setStatus('✓ Sinkron sama web live');
}
Object.assign(ACTIONS, {
  publish,
  pull: () => pullLive(false),
  ghTest: async () => {
    if(!GH.token) return toast('Token masih kosong');
    try{
      const r = await gh('');
      if(!r.ok) throw await ghErr(r);
      const j = await r.json();
      toast(j.permissions && j.permissions.push === false ? '⚠ Token cuma bisa baca — butuh Contents: Read and write' : `✓ Nyambung ke ${j.full_name}`);
    }catch(err){ toast('✗ ' + err.message); }
  },
  ghForget: () => { if(confirm('Hapus token dari browser ini?')){ GH.token = ''; saveGH(); render(); toast('Token dihapus'); } }
});

render();
updatePreview();
updatePubState();
syncOnStart();
</script>
